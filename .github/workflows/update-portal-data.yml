name: Update Portal Data

on:
  repository_dispatch:
    types: [supabase-change]
  workflow_dispatch:
  schedule:
    # 作为兜底，每 6 小时运行一次
    - cron: '0 */6 * * *'

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 分别获取各表数据
          curl -s "$SUPABASE_URL/rest/v1/public_info?select=*&active=eq.true" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o public_info.json

          curl -s "$SUPABASE_URL/rest/v1/events?select=*&active=eq.true&order=date" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o events.json

          curl -s "$SUPABASE_URL/rest/v1/announcements?select=*&active=eq.true&order=priority" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o announcements.json

          curl -s "$SUPABASE_URL/rest/v1/quick_links?select=*&active=eq.true&order=sort_order" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o quick_links.json

          curl -s "$SUPABASE_URL/rest/v1/drivers?select=*&active=eq.true&order=sort_order" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o drivers.json

      - name: Merge into portal-data.json
        run: |
          node -e "
          const fs = require('fs');
          const publicInfo = JSON.parse(fs.readFileSync('public_info.json', 'utf8'));
          const events = JSON.parse(fs.readFileSync('events.json', 'utf8'));
          const announcements = JSON.parse(fs.readFileSync('announcements.json', 'utf8'));
          const quickLinks = JSON.parse(fs.readFileSync('quick_links.json', 'utf8'));
          const drivers = JSON.parse(fs.readFileSync('drivers.json', 'utf8'));

          const data = {
            announcement: publicInfo.find(i => i.section === 'main_announcement') || null,
            events: events || [],
            announcements: announcements || [],
            quickLinks: quickLinks || [],
            drivers: drivers || []
          };

          fs.writeFileSync('portal-data.json', JSON.stringify(data, null, 2));
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portal-data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update portal data"
            git push
          fi

      - name: Cleanup temp files
        run: rm -f public_info.json events.json announcements.json quick_links.json drivers.json
