name: Update Portal Data

on:
  repository_dispatch:
    types: [supabase-change]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: update-portal-data
  cancel-in-progress: false

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          H=(-H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          curl -sS --fail "$SUPABASE_URL/rest/v1/public_info?select=*&active=eq.true" "${H[@]}" -o public_info.json || echo '[]' > public_info.json
          curl -sS --fail "$SUPABASE_URL/rest/v1/events?select=*&active=eq.true&order=date" "${H[@]}" -o events.json || echo '[]' > events.json
          curl -sS --fail "$SUPABASE_URL/rest/v1/announcements?select=*&active=eq.true&order=priority" "${H[@]}" -o announcements.json || echo '[]' > announcements.json
          curl -sS --fail "$SUPABASE_URL/rest/v1/quick_links?select=*&active=eq.true&order=sort_order" "${H[@]}" -o quick_links.json || echo '[]' > quick_links.json

      - name: Merge into portal-data.json
        run: |
          node -e "
          const fs = require('fs');
          const read = f => {
            try { const d = JSON.parse(fs.readFileSync(f, 'utf8')); return Array.isArray(d) ? d : []; }
            catch { return []; }
          };
          const publicInfo = read('public_info.json');
          const events = read('events.json');
          const announcements = read('announcements.json');
          const quickLinks = read('quick_links.json');
          const data = {
            announcement: publicInfo.find(i => i.section === 'main_announcement') || null,
            events, announcements, quickLinks
          };
          fs.writeFileSync('portal-data.json', JSON.stringify(data, null, 2));
          "

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portal-data.json
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update portal data"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Bump version and push tag
        if: steps.commit.outputs.changed == 'true'
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: ''

      - name: Purge jsDelivr @latest
        if: steps.commit.outputs.changed == 'true'
        run: |
          echo "Waiting for GitHub tag propagation..."
          sleep 10
          echo "Purging @latest..."
          curl -s "https://purge.jsdelivr.net/gh/cjhorngg/mazu-portal-data@latest/portal-data.json" | tee purge-latest.json
          echo ""
          echo "Done."

      - name: Cleanup temp files
        if: always()
        run: rm -f public_info.json events.json announcements.json quick_links.json
