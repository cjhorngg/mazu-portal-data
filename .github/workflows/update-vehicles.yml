name: Update Vehicles Data

on:
  repository_dispatch:
    types: [vehicles-change]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this publish was triggered'
        required: false
        default: 'manual'

# Serialize; do NOT cancel in-progress. The last run should always win.
concurrency:
  group: update-vehicles-data
  cancel-in-progress: false

jobs:
  update-vehicles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch vehicles from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sS --fail "$SUPABASE_URL/rest/v1/vehicles?select=*&order=carplate" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o vehicles-raw.json

      - name: Transform to frontend shape
        run: |
          node -e "
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('vehicles-raw.json', 'utf8'));

          raw.sort((a, b) => String(a.carplate).localeCompare(String(b.carplate)));

          const drivers = raw.map(v => ({
            carplate: String(v.carplate),
            name:     String(v.name || ''),
            mobile:   String(v.mobile || '')
          }));

          const positioned = raw.filter(v => v.latitude != null && v.longitude != null);
          const data = positioned.map(v => ({
            carPlate:  String(v.carplate),
            name:      String(v.name || 'GPS'),
            mobile:    String(v.mobile || ''),
            fixTime:   v.fixtime || null,
            latitude:  v.latitude,
            longitude: v.longitude,
            coordinateSystem: v.coordinatesystem || 'wgs84',
            address:   v.address || ''
          }));

          // Must stay in sync with PROTECTED_POSITION_PLATES in GAS Config.js.
          const protectedPlates = ['媽祖', '頭旗'];

          const previous = fs.existsSync('vehicles.json')
            ? JSON.parse(fs.readFileSync('vehicles.json', 'utf8'))
            : null;

          const unchanged = previous
            && JSON.stringify(previous.drivers)         === JSON.stringify(drivers)
            && JSON.stringify(previous.data)            === JSON.stringify(data)
            && JSON.stringify(previous.protectedPlates) === JSON.stringify(protectedPlates);

          const out = {
            updatedAt: unchanged ? previous.updatedAt : new Date().toISOString(),
            count: data.length,
            drivers: drivers,
            data: data,
            protectedPlates: protectedPlates
          };

          fs.writeFileSync('vehicles.json', JSON.stringify(out, null, 2) + '\n');
          console.log(unchanged ? 'NO CONTENT CHANGE' : 'DATA CHANGED');
          console.log('drivers:', drivers.length, 'positioned:', data.length);
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vehicles.json
          if git diff --cached --quiet; then
            echo "No changes — exiting without commit"
            exit 0
          fi
          git commit -m "Update vehicles data [${{ github.event.inputs.reason || 'auto' }}]"
          git pull --rebase origin main
          git push origin main

      - name: Cleanup
        run: rm -f vehicles-raw.json
