name: Update Vehicles Data

on:
  repository_dispatch:
    types: [vehicles-change]
  workflow_dispatch:

# Prevent two runs of this workflow from racing each other
concurrency:
  group: update-vehicles-data
  cancel-in-progress: true

jobs:
  update-vehicles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so rebase works cleanly
          fetch-depth: 0

      - name: Fetch vehicles from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sS --fail "$SUPABASE_URL/rest/v1/vehicles?select=*&order=carplate" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o vehicles-raw.json

      - name: Transform to frontend shape
        run: |
          node -e "
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('vehicles-raw.json', 'utf8'));

          // Render a Supabase timestamptz value as Taipei wall-clock ISO with
          // explicit +08:00 offset. The instant is preserved; the raw string
          // becomes human-readable in Taipei, matching Sheets and the viewer.
          function taipeiISO(v) {
            if (!v) return null;
            const d = new Date(v);
            if (isNaN(d.getTime())) return v;
            const parts = new Intl.DateTimeFormat('sv-SE', {
              timeZone: 'Asia/Taipei',
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit', second: '2-digit',
              hour12: false
            }).formatToParts(d);
            const g = t => (parts.find(p => p.type === t) || {}).value || '';
            return g('year') + '-' + g('month') + '-' + g('day') + 'T' +
                   g('hour') + ':' + g('minute') + ':' + g('second') + '+08:00';
          }

          const transformed = raw.map(v => ({
            carPlate: v.carplate,
            name: v.name,
            mobile: v.mobile,
            fixTime: taipeiISO(v.fixtime),
            latitude: v.latitude,
            longitude: v.longitude,
            coordinateSystem: v.coordinatesystem || 'wgs84',
            address: v.address
          }));
          fs.writeFileSync('vehicles.json', JSON.stringify({
            updatedAt: new Date().toISOString(),
            count: transformed.length,
            data: transformed
          }, null, 2));
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vehicles.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update vehicles data"
          # Rebase onto remote main in case another push landed while we ran
          git pull --rebase origin main
          git push origin main

      - name: Cleanup
        run: rm -f vehicles-raw.json
