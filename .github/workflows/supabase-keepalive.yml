name: Keep Supabase Active

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (real table via anon key)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🔔 Pinging Supabase..."

          # Hit an actual table to trigger real database activity
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/vehicles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP status: $HTTP_CODE"
          echo "Response:"
          cat /tmp/resp.txt
          echo ""

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
            echo "✅ Supabase is active (HTTP $HTTP_CODE)"
          else
            echo "❌ Supabase ping failed (HTTP $HTTP_CODE)"
            exit 1
          fi
