name: Update Portal Data Google Sheets

on:
  repository_dispatch:
    types: [sheets-change]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: mazu-portal-data-update-google
  cancel-in-progress: false

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: googleapis-${{ hashFiles('package-lock.json') }}
          restore-keys: googleapis-

      - name: Install googleapis
        run: npm install googleapis

      - name: Fetch from Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID_PORTAL }}
        run: |
          node -e "
          const { google } = require('googleapis');
          const fs = require('fs');

          const creds = JSON.parse(process.env.GOOGLE_SERVICE_ACCOUNT_JSON);
          const auth = new google.auth.GoogleAuth({
            credentials: creds,
            scopes: ['https://www.googleapis.com/auth/spreadsheets.readonly']
          });

          const sheets = google.sheets({ version: 'v4', auth });
          const sheetId = process.env.SHEET_ID;

          const parseRow = (row) => {
            const parsed = {};
            for (const [k, v] of Object.entries(row)) {
              if (k === 'id' || k === 'sort_order') {
                parsed[k] = v !== '' && !isNaN(v) ? Number(v) : v;
              } else if (k === 'active') {
                parsed[k] = String(v).trim().toUpperCase() === 'TRUE';
              } else {
                parsed[k] = v;
              }
            }
            return parsed;
          };

          async function readSheet(name) {
            try {
              const res = await sheets.spreadsheets.values.get({
                spreadsheetId: sheetId,
                range: name + '!A:Z'
              });
              const rows = res.data.values || [];
              if (rows.length < 2) return [];
              const headers = rows[0].map(h => String(h).trim());
              return rows.slice(1).map(row => {
                const obj = {};
                headers.forEach((h, i) => { obj[h] = row[i] || ''; });
                return parseRow(obj);
              });
            } catch (err) {
              console.error('Failed to read sheet \"' + name + '\":', err.message);
              return [];
            }
          }

          (async () => {
            const publicInfo    = await readSheet('public_info');
            const events        = await readSheet('events');
            const announcements = await readSheet('announcements');
            const quickLinks    = await readSheet('quick_links');

            const data = {
              announcement: publicInfo.find(i => i.section === 'main_announcement' && i.active) || null,
              events:        events.filter(e => e.active),
              announcements: announcements.filter(a => a.active),
              quickLinks:    quickLinks.filter(q => q.active)
            };

            fs.writeFileSync('portal-data-google.json', JSON.stringify(data, null, 2));
            console.log('Wrote portal-data-google.json with exact schema match.');
          })().catch(err => { console.error(err); process.exit(1); });
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portal-data-google.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Portal Data Google Sheets"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Cleanup
        if: always()
        run: rm -rf node_modules package-lock.json
